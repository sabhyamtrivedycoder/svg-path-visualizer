<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVG Path Scope — Vector Inspector</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="logo"><span>📐</span><h1>SVG Path Scope</h1></div>
    <a href="https://sabhyamtrivedycoder.github.io/portfolio/" target="_blank" class="nav-portfolio">Portfolio ↗</a>
  </header>
  <main class="main">
    <div class="input-bar">
      <label>Path "d" Attribute:</label>
      <input type="text" id="pathInput" value="M 20 80 Q 150 10 280 80 T 540 80">
    </div>
    <div class="canvas-wrap">
      <svg id="svgStage" viewBox="0 0 600 200">
        <path id="svgPath" d="" fill="none" stroke="#00f0ff" stroke-width="4"></path>
      </svg>
    </div>
  </main>
  <footer>
    <p>Engineered by <a href="https://github.com/sabhyamtrivedycoder" target="_blank">Sabhyam Trivedy</a> • MIT License</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
